# Scope manifest — NAS §14.5
project: pro-league
nas_edition: v0.20                # verified against NAS.md header at write time.
                                  # Stood at v0.15 through v0.16 and v0.17 — a two-version
                                  # lag in the file whose only job is pinning the version.
                                  # Caught by an external reader, not by us. See the
                                  # edition-check discipline at the foot of this file.
scale: novel
mode: hard                        # hard | soft | mixed (per scope)

scope:
  contract_stack: {containers: 1}       # acts are active — three fixers, one league
  knowledge_scopes:
    observers: [reader, faction:the-league, character:*]
  pillars: {active: true}
  world_graph:
    layers: [physics, biology, economics, institutions, characters]
    decree_threshold: institutions
  composition:
    root: world_root                    # WORLD-2 — created here, never authored;
                                        # holds field + invariants only (WORLD-3)
    bands: [individual, crew, institution, world]
  cut: {active: true}
  time: {anchors_may_be_clouds: true}

# The one thing this project exists to stress that the door could not:
#   three load-bearing agents whose valences foreclose ACROSS agents.
#   See queries.md — conflict is a graph property here, not an authored beat.
emphasis: horizontal


# ─────────────────────────────────────────────────────────────────────────────
# EXCLUSIONS
#
# §14.5 defines `rules_excluded` as "rule IDs disabled by parameters, with
# reason". Until v0.17 every manifest in this repo carried an empty list, so the
# mechanism was specified and never exercised — a schema comment rather than a
# demonstrated feature. This is the worked example.
#
# An exclusion carries four fields. `reason` is one of three classes:
#
#   not_yet_applicable — the object the rule checks does not exist yet. The rule
#                        is correct and would fire correctly; there is nothing
#                        for it to fire on. Re-enables itself when `review`
#                        happens. NOT a disagreement.
#   parameter          — a manifest setting turns it off. Mechanical.
#   judgment           — the author has read the rule, understood it, and
#                        declined it. The reason must be arguable, and the
#                        exclusion must carry a review trigger, because this is
#                        the class that can be wrong.
#
# A `judgment` exclusion with no stated review trigger is not an exclusion; it
# is an opinion hiding in a config file.
# ─────────────────────────────────────────────────────────────────────────────

rules_excluded:

  - id: PUB-1
    reason: not_yet_applicable
    note: >
      PUB-1 gates retcon cones crossing a publication boundary. Nothing in this
      project has reached a reader, so no partition is frozen and the rule has
      no boundary to guard. Excluding it is not a disagreement with the rule —
      it is the observation that a `gate | invariant` cannot fire when the
      condition it gates on cannot exist. At `scale: novel` this project meets
      exactly one boundary, at the end.
    review: first release of any partition to any external reader — including a
      beta read, which freezes a partition just as firmly as publication does.

  - id: CONTRACT-2
    reason: not_yet_applicable
    note: >
      CONTRACT-2 requires every roadmap item to be claimed by at least one
      chapter and every chapter to claim at least one item. This project has no
      Roadmap object — §6's authored half was never written, and the derived
      half has one chapter to derive from. The rule would fire on every chapter
      for want of a target that does not exist, which is noise rather than a
      finding.
    review: when `Roadmap.md` is authored, or at the second chapter — whichever
      comes first.

# No `judgment` exclusion exists in this project, and that is worth stating
# rather than leaving to inference: every rule the register carries that CAN
# apply here IS applied, including the ones currently failing. PILLAR-1 reports
# six unpaid preconditions; VAL-2 flags an inert valence; MODAL-4 surfaces a
# high-layer `must` with no world derivation; CONTRAST-1 calls a facet thin.
# None of those is excluded. A failing check is evidence; a silenced one is not.
#
# The `judgment` class is documented above and unused on purpose — the mechanism
# has to be able to express a real disagreement, and this project does not have
# one yet.


# ─────────────────────────────────────────────────────────────────────────────
# EDITION-CHECK DISCIPLINE
#
# `nas_edition` is re-verified against NAS.md's header at every exchange with a
# consumer of this manifest, and never trusted from a summary document. This
# rule exists because the field silently lagged the spec by two versions and was
# caught externally — the same defect class as ledger 0013's SOFTWARE.md drift,
# in the artifact specifically designed to prevent it.
#
# A pinned edition that nobody re-verifies is a hand-maintained projection, and
# GRAPH-2 says what happens to those.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# ID NAMESPACES — which require a defining artifact (added v0.20, ledger 0020)
#
# Machine-readable on purpose. The integrity check is a set-difference and must
# stay a deterministic script with no model in the loop: collect every id
# matching `<ns>_*` across the corpus, subtract the ids that resolve to a
# defining artifact, and report the remainder. This block is the declaration
# that check reads; without it, "dangling reference" and "id-in-place" are
# indistinguishable, which is how 49 of 64 ids sat unresolved (ledger 0019).
#
# THE TEST — not a taste call, and not a list to be extended by habit:
#   requires_node = true  ⟺  members carry state that some fold READS.
#   requires_node = false ⟺  the id is a label consumed only by the artifact
#                            that names it, and no fold ever dereferences it.
# A namespace does not earn a node because it feels important. It earns one when
# something downstream would have to guess in its absence. Everything else is a
# string, and NAS is not a filing cabinet.
# ─────────────────────────────────────────────────────────────────────────────

id_namespaces:

  - ns: world
    requires_node: true
    home: Graph/world/
    holds: [invariants, field_role]
    why: "WORLD-2 — exactly one, created by the manifest; the root of the member_of DAG"

  - ns: faction
    requires_node: true
    home: Graph/world/
    holds: [valences, member_of, level]
    why: "a collective agent; carries valences that forecloses-edges read"

  - ns: char
    requires_node: true
    home: Graph/characters/
    holds: [valences, facets, methods, member_of, voice]
    exempt_when: "non-load-bearing walk-on (PATTERN-1) — carries no state any fold reads"
    exempt_now: [char_booker, char_delacroix, char_marek_dead]
    why: "agents are the motive layer; §8.5 folds their moves into arc"

  - ns: fact
    requires_node: true
    home: Graph/facts.md, or Graph/world/<id>.md once it earns prose
    promote_when: "competing read-modalities, a trajectory, or consequence slots"
    holds: [content, modality, edges]
    excludes: [canonised_in, scopes, confidence]   # folds over info_ops — never copied
    cloud_variant: "an uncollapsed fact declares `question` + `candidates`, never `content`"
    why: >
      MODAL-1 requires every statement to carry canonical modality, and OBS-1
      requires a canonisation record. Neither has anywhere to live without a
      node. 18 facts, 1 node was the state that let fact_burn_rate be canon by
      decree for 10 references.

  - ns: val
    requires_node: true
    home: inline within the owning agent node
    holds: [lack, kind, pressure, candidates, forecloses, bound_by]
    why: >
      A valence has no existence apart from its agent — it is not a free node and
      must not become one. `requires_node: true` here means "must be defined",
      not "must be a file". The distinction matters: a separate file would need a
      hand-maintained owner edge, which is GRAPH-2.

  - ns: setup
    requires_node: true
    home: Graph/setups.md
    holds: [obligation, window, discharge, load_bearing]
    excludes: [plant_site, payoff_site, status]
    why: >
      SETUP-1 checks for a payoff window; with no artifact there was nowhere to
      write one. `excludes` is load-bearing: plant and payoff sites are declared
      by scenes and folded, never copied here.

  - ns: theme
    requires_node: true
    home: Graph/
    holds: [question]
    why: "§8.6b — the contested question is authored; the positions on it are derived from valences"
    status_now: defined         # theme_use defined in Graph/themes.md v0.20

  - ns: loc
    requires_node: false
    why: >
      A label on `active_field`. Nothing dereferences it: no fold reads location
      state, and the field's effect on a scene is carried by §8.6 modifiers,
      which name their source explicitly. Promote a single location to a node the
      moment it emits modifiers or holds facts of its own — the test decides, per
      location, not the namespace.

  - ns: rv
    requires_node: false
    why: >
      Reader values are declared inline inside a scene's
      `intended_reader_trajectory` and folded by the reader stream (§3.5, §10).
      Giving them nodes would assert a persistent reader-state object, and §3.5
      is explicit that the reader is the one variable the system cannot solve.
      The inline declaration is the design, not a shortcut.
